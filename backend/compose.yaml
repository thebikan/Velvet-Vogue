services:
  php:
    build: .
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: velvet_vogue
      DB_USERNAME: velvet_vogue
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TEST_DB_HOST: mysql-test
      TEST_DB_PORT: 3306
      TEST_DB_DATABASE: velvet_vogue_test
      TEST_DB_USERNAME: velvet_vogue_test
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/app/public:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: velvet_vogue
      MYSQL_USER: velvet_vogue
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis-test:
    image: redis:7-alpine
    profiles: [test]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  mysql-test:
    image: mysql:8.0
    profiles: [test]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: velvet_vogue_test
      MYSQL_USER: velvet_vogue_test
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
