# Include this file at SERVER scope in XAMPP apache/conf/httpd.conf.
# Edit this path if the checkout is elsewhere. Requires mod_rewrite and Apache 2.4.
Define VelvetVogueRoot "C:/xampp/htdocs/Velvet-Vogue"

# Protect the entire checkout, including access via the DEFAULT localhost vhost.
<Directory "${VelvetVogueRoot}">
    AllowOverride None
    Options None
    Require all denied
</Directory>

# Dedicated loopback port: no hosts-file edits or public/LAN listener required.
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    ServerName localhost
    DocumentRoot "${VelvetVogueRoot}/backend/public"
    <Directory "${VelvetVogueRoot}/backend/public">
        AllowOverride None
        Options +FollowSymLinks -Indexes -MultiViews
        Require local
        DirectoryIndex index.php
        RewriteEngine On
        # Never serve hidden files, nor any PHP entrypoint except index.php.
        RewriteRule "(^|/)\." - [F]
        RewriteRule "^(?!index\.php$).*\.(?:php|phtml|phar)(?:/|$)" - [F,NC]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule !^index\.php$ - [F]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [END]
    </Directory>
    ErrorLog "logs/velvet-vogue-error.log"
    # Omit query strings, referrers, cookies and authorization headers.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" velvet_vogue
    CustomLog "logs/velvet-vogue-access.log" velvet_vogue
</VirtualHost>
