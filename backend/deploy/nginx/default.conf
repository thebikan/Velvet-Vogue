# Included inside nginx's http context. TLS must terminate at the deployment ingress.
map $request_uri $limit_key {
    default $binary_remote_addr;
    ~^/api/v1/(health|ready)(\?|$) "";
}
limit_req_zone $limit_key zone=api:10m rate=20r/s;
log_format safe_api '$request_id $request_method $status $request_time';
server {
    listen 80;
    server_name _;
    root /app/public;
    server_tokens off;
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    client_body_timeout 10s;
    access_log /var/log/nginx/access.log safe_api;
    # Avoid request URLs and query strings in routine logs.
    error_log /var/log/nginx/error.log crit;
    location ~ /\. { deny all; }
    location / {
        rewrite ^ /index.php last;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
        fastcgi_read_timeout 15s;
    }
    location ~ \.php$ { return 404; }
}
